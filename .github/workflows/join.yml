name: Join tracker

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: tracker-writes

jobs:
  join:
    if: startsWith(github.event.issue.title, 'join')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Process join request
        id: req
        run: node scripts/join-request.mjs
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}

      - name: Take fresh snapshot
        if: steps.req.outputs.status == 'added'
        run: node scripts/track-xp.mjs

      - name: Commit
        if: steps.req.outputs.status == 'added'
        env:
          NEW_USERNAME: ${{ steps.req.outputs.username }}
        run: |
          git config user.name "xp-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/usernames.json data/xp-history.json
          git diff --cached --quiet || git commit -m "Join tracker: $NEW_USERNAME"
          git push

      - name: Reply and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          STATUS: ${{ steps.req.outputs.status }}
          USERNAME: ${{ steps.req.outputs.username }}
          XP: ${{ steps.req.outputs.xp }}
          REASON: ${{ steps.req.outputs.reason }}
        run: |
          if [ "$STATUS" = "added" ]; then
            MSG="✅ Welcome, **$USERNAME**! You're on the class tracker with $XP total XP so far. The tracker page updates itself within a couple of minutes."
          elif [ "$STATUS" = "exists" ]; then
            MSG="ℹ️ **$USERNAME** is already on the class tracker — check the tracker page."
          else
            MSG="❌ Couldn't add that username. $REASON"
          fi
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$MSG"
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"
