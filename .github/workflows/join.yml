name: Join tracker

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: tracker-writes

jobs:
  join:
    # Only titles like "join: username" — a plain "join button broken" bug
    # report must not be auto-processed and closed.
    if: startsWith(github.event.issue.title, 'join:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Process join request
        id: req
        run: node scripts/join-request.mjs
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}

      - name: Take fresh snapshot
        if: steps.req.outputs.status == 'added'
        run: node scripts/track-xp.mjs

      - name: Commit
        if: steps.req.outputs.status == 'added'
        env:
          ADDED: ${{ steps.req.outputs.added }}
        run: |
          git config user.name "xp-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/usernames.json data/xp-history.json
          git diff --cached --quiet || git commit -m "Join tracker: $ADDED added via issue"
          for i in 1 2 3; do git push && break || { git pull --rebase; sleep 3; }; done

      - name: Reply and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          STATUS: ${{ steps.req.outputs.status }}
          ADDED: ${{ steps.req.outputs.added }}
          REPORT: ${{ steps.req.outputs.report }}
        run: |
          if [ "$STATUS" = "added" ]; then
            HEAD="✅ Welcome to the class tracker ($ADDED added)! The tracker page updates itself within a couple of minutes."
          elif [ "$STATUS" = "exists" ]; then
            HEAD="ℹ️ Already on the class tracker — check the tracker page."
          else
            HEAD="❌ Couldn't add anyone from this issue:"
          fi
          BODY="$HEAD"$'\n\n'"$REPORT"
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"
