name: Track Duolingo XP

on:
  schedule:
    - cron: "10 8 * * *" # 08:10 UTC = 00:10 PST / 01:10 PDT — just after midnight Pacific, so each snapshot captures the full day that ended
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tracker-writes

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch XP snapshots
        run: node scripts/track-xp.mjs

      - name: Commit snapshot
        run: |
          git config user.name "xp-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/xp-history.json
          git diff --cached --quiet || git commit -m "XP snapshot $(date -u +%F)"
          git push
