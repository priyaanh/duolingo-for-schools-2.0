name: Track Duolingo XP

on:
  schedule:
    - cron: "10 8 * * *" # 08:10 UTC = 00:10 PST / 01:10 PDT — just after midnight Pacific, so each snapshot captures the full day that ended
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tracker-writes

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch XP snapshots
        # DUOLINGO_JWT is an optional repo secret (Settings → Secrets and variables →
        # Actions): a Duolingo login token. With it, the snapshot holds each member's
        # full Total XP and exact daily XP; without it, public-profile numbers only.
        env:
          DUOLINGO_JWT: ${{ secrets.DUOLINGO_JWT }}
        run: node scripts/track-xp.mjs

      - name: Commit snapshot
        run: |
          git config user.name "xp-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/xp-history.json
          git diff --cached --quiet || git commit -m "XP snapshot $(date -u +%F)"
          for i in 1 2 3; do git push && break || { git pull --rebase; sleep 3; }; done
